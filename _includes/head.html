{% assign profile = site.about | first %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ profile.name }}</title>
<meta name="description" content="{{ site.description | strip_newlines | strip }}">
<meta property="og:title" content="{{ profile.name }}">
<meta property="og:description" content="{{ site.description | strip_newlines | strip }}">
<meta property="og:image" content="{{ profile.avatar }}">
<link rel="icon" href="{{ profile.avatar }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
